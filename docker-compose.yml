version: '3.8'

services:
  songbattle:
    build: .
    image: ghcr.io/t0biii/songbattle:latest
    container_name: songbattle
    ports:
      - "8080:8080"
    environment:
      # Required: Your Spotify App credentials
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URL=${SPOTIFY_REDIRECT_URL:-http://localhost:8080/api/callback}
      
      # Optional: Custom share URL for results
      - SHARE_URL=${SHARE_URL:-}

      # Optional: Meta (Facebook) App ID for the official Share Dialog
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      
      # Optional: Image cleanup settings (defaults shown)
      - UPLOAD_TTL_DAYS=${UPLOAD_TTL_DAYS:-30}
      - UPLOAD_CLEANUP_INTERVAL_HOURS=${UPLOAD_CLEANUP_INTERVAL_HOURS:-24}
    volumes:
      # Persist generated result images across container restarts
      - songbattle-results:/app/web/results
      # Persist Spotify tokens across container restarts
      - songbattle-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  songbattle-results:
    driver: local
  songbattle-data:
    driver: local
