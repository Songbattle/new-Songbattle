version: '3.8'

services:
  spotify-battle:
    build: .
    image: ghcr.io/t0biii/spotify-battle:latest
    container_name: spotify-battle
    ports:
      - "8080:8080"
    environment:
      # Required: Your Spotify App credentials
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URL=${SPOTIFY_REDIRECT_URL:-http://localhost:8080/api/callback}
      
      # Optional: Custom share URL for results
      - SHARE_URL=${SHARE_URL:-}
      
      # Optional: Image cleanup settings (defaults shown)
      - UPLOAD_TTL_DAYS=${UPLOAD_TTL_DAYS:-30}
      - UPLOAD_CLEANUP_INTERVAL_HOURS=${UPLOAD_CLEANUP_INTERVAL_HOURS:-24}

      # Optional: Rate limiting per client IP (defaults shown)
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-30}
      - RATE_LIMIT_IMAGE_PER_MINUTE=${RATE_LIMIT_IMAGE_PER_MINUTE:-6}
      - RATE_LIMIT_IMAGE_BURST=${RATE_LIMIT_IMAGE_BURST:-3}
      # Set to true behind a reverse proxy (Traefik) to use the real client IP
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-X-Forwarded-For}
    volumes:
      # Persist generated result images across container restarts
      - spotify-battle-results:/app/web/results
      # Persist Spotify tokens across container restarts
      - spotify-battle-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  spotify-battle-results:
    driver: local
  spotify-battle-data:
    driver: local
