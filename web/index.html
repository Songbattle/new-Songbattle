<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spotify Battle</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Spotify Battle</h1>
      <div class="top-actions">
          <div style="display:flex;align-items:center;gap:8px">
          <img id="meAvatar" src="" alt="avatar" style="width:36px;height:36px;border-radius:50%;display:none">
          <div id="me" style="color:var(--muted)">Not logged in</div>
        </div>
        <button id="loginBtn">Login</button>
        <button id="whoBtn" class="ghost">Refresh</button>
        <button id="logoutBtn" class="ghost">Logout</button>
      </div>
    </header>

    <div class="grid">
      <div>
        <div class="card">
          <div id="searchBox" style="display:flex;align-items:flex-start;gap:12px;position:relative">
            <div style="flex:1">
              <label style="display:block;font-size:12px;color:var(--muted)">Albums</label>
              <div style="display:flex;gap:8px;align-items:center">
                <input id="searchInput" type="text" placeholder="Search album..." autocomplete="off" />
                <button id="searchBtn">Search</button>
              </div>
              <div id="suggestions" class="suggestions" aria-hidden="true"></div>
              <div id="searchResults" class="album-list" style="margin-top:12px"></div>
              <div id="pagination" style="margin-top:8px;display:flex;gap:8px;align-items:center"></div>
            </div>
            <div style="width:320px">
              <label style="display:block;font-size:12px;color:var(--muted)">Playlists</label>
              <div style="display:flex;gap:8px;align-items:center">
                <input id="playlistSearchInput" type="text" placeholder="Search playlist..." autocomplete="off" style="flex:1" />
                <button id="playlistSearchBtn">Search</button>
              </div>
              <div id="playlistSuggestions" class="suggestions" aria-hidden="true"></div>
              <div id="playlistResults" class="album-list" style="margin-top:12px"></div>
              <div id="playlistPagination" style="margin-top:8px;display:flex;gap:8px;align-items:center"></div>
            </div>
          </div>
        </div>

        <div id="albumSection" style="margin-top:14px"></div>
        <div id="votingSection" style="margin-top:14px"></div>
      </div>

      <aside>
        <div class="card">
          <h3>Tips</h3>
          <p class="muted">Select two songs to compare. Results are saved in LocalStorage.</p>
          <div style="margin-top:10px"><button id="exportAll" class="ghost">Export results</button></div>
        </div>
      </aside>
    </div>

    <script src="/app.js"></script>
  </div>
</body>
</html>
